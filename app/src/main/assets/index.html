<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Panel157 Neon</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #080b12;
      color: #f4f7ff;
      font-family: Arial, sans-serif;
    }
    .painel {
      max-width: 440px;
      margin: 20px auto;
      padding: 22px;
      border: 1px solid #00f0ff;
      border-radius: 18px;
      background: #101522;
      box-shadow: 0 0 22px #00d9ff22;
    }
    h1 { color: #00f0ff; margin-top: 0; }
    .status { color: #9baac2; font-size: 13px; }
    .item {
      margin: 16px 0;
      padding: 14px;
      border-radius: 10px;
      background: #1a2233;
    }
    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #00d9ff;
      color: #061018;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="painel">
    <h1>PANEL157</h1>
    <p class="status">NEON • ANDROID</p>
    <div class="item">Interface carregada com sucesso.</div>
    <div class="item">ESP — demonstração visual</div>
    <div class="item">Configurações do painel</div>
    <button onclick="alert('Painel de teste funcionando!')">
      TESTAR PAINEL
    </button>
  </main>
</body>
</html>
